name: Mission planning

# The planner's preview maths is a deliberate mirror of the writer's. Mirrors
# drift, and a preview that lies about photo count or flight time is worse than
# no preview — so the end-to-end test runs on every push that touches either
# side, not only when someone remembers.

on:
  push:
    paths:
      - "scripts/mission/**"
      - "nodes/**"
      - "web/**"
      - "fixtures/**"
      - ".github/workflows/mission.yml"
  pull_request:
    paths:
      - "scripts/mission/**"
      - "nodes/**"
      - "web/**"
      - "fixtures/**"
  workflow_dispatch:

jobs:
  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node strips the TypeScript itself, so there is no build step and no
          # dependency to install for this check.
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: A Mission Spec becomes a Mission the aircraft can fly
        run: python3 scripts/mission/e2e_test.py
      # The host-side self-checks assert against the same fixtures the web tests
      # read, so the two languages are pinned in the gate, not only locally.
      - name: The host self-checks
        run: |
          python3 scripts/mission/keys.py --selftest
          python3 scripts/mission/b2.py --selftest
          python3 scripts/mission/b2_status.py --selftest
          python3 scripts/mission/collect.py --selftest
          python3 scripts/mission/load_test.py
          python3 scripts/mission/calibrate.py --selftest
          python3 scripts/mission/kmz.py --selftest
      # ADR 0018: every Node carries a check, and the seam between Nodes runs
      # too. They are offline by construction, so they run here on every change.
      # check_head inspects image metadata with exiftool; Pillow builds its fixtures.
      # GDAL runs export-cog's own check, which was skipped here until a crash on
      # an empty Orthomosaic was found on the host instead.
      - run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl gdal-bin ffmpeg
      - run: pip install pillow
      - name: The Nodes' own checks
        run: |
          # The heavy evidence needs docker and a dataset that lives on the
          # compute host; --allow-skips marks that gap deliberate and prints it, so a
          # green run never silently means "nothing ran" (decision on #68).
          python3 nodes/check_ortho.py --allow-skips
          python3 nodes/check_splat.py
          python3 nodes/check_head.py
          python3 nodes/check_showcase.py
          python3 pipeline/runner.py --selftest
          python3 nodes/retention/retention.py --selftest
          python3 nodes/check_retention.py
          python3 nodes/check_deliver.py

  # The status console's join, predicates and metrics are pure functions; they
  # run here so a broken row cannot reach the tab unnoticed. Build is the real
  # deployment gate: the withdraw route shipped broken once precisely because
  # nothing type-checked it.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Next generates LayoutProps/PageProps into .next/types; without this,
      # a bare `tsc --noEmit` fails on a clean checkout.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run lint
      - run: npm run build
        env:
          # The build never talks to B2; placeholders keep the route modules
          # from failing their configuration check at build time.
          B2_BUCKET: ci
          B2_KEY_ID: ci
          B2_APP_KEY: ci
          B2_READ_KEY_ID: ci
          B2_READ_APP_KEY: ci
          DISPATCH_SECRET: ci

  # D15: the auth work needs a real Postgres, so it runs as its own job and
  # only this job pays for the service. The web job above stays DB-free.
  web-auth:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - "5432:5432"
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Migrations apply
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      - name: Migrations are idempotent
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      - run: npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

  # #242: the sign-up and sign-in flows over a real browser and a real database.
  web-e2e:
    runs-on: ubuntu-latest
    # The suite takes about a minute; a hang must fail, not hold a runner.
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - "5432:5432"
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright-core install chromium --with-deps
      - name: Sign-up and sign-in, end to end
        run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

